[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civilcalc"
version = "1.0.0"
description = "Menu-driven civil engineering calculator suite with code-referenced formulas and unit handling"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
civilcalc = "civilcalc.cli:main"

[tool.setuptools.packages.find]
include = ["civilcalc*"]
